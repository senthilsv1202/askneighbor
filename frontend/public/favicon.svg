<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AskNeighbor">
  <!-- Matches the navbar logo: primary-600 (#2563eb) rounded square + the lucide
       "users" glyph. Deliberately text-free: the old PWA icon's "AN" lettering
       turns to mush at 16px. Glyph is scaled to ~59% of the tile so it stays
       legible in a browser tab; stroke-width is 2.5 rather than lucide's default
       2 for the same reason. -->
  <rect width="32" height="32" rx="8" fill="#2563eb"/>
  <g transform="translate(4.6 4.6) scale(0.95)"
     fill="none" stroke="#ffffff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <path d="M16 3.128a4 4 0 0 1 0 7.744"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <circle cx="9" cy="7" r="4"/>
  </g>
</svg>
